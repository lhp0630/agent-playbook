[project]
name = "agent-playbook"
version = "0.1.0"
description = "YAML-configured multi-agent workflows powered by pydantic-ai DynamicWorkflow."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fire>=0.7",
    "pydantic-ai-slim[openai]>=2.18.0",
    "pydantic-ai-harness[dynamic-workflow]>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

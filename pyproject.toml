[project]
name = "badger"
version = "0.1.0"
description = "Declarative multi-agent divide-and-conquer agent framework. Configure specialist roles and stage flows in YAML to assemble coding agents, review agents, debate agents, and other collaborative agents."
requires-python = ">=3.10"
dependencies = [
    "langchain[openai]>=0.3",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fire>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[project.scripts]
agent = "agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

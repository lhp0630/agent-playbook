[project]
name = "agent-playbook"
version = "0.1.1"
description = "YAML-configured multi-agent workflows powered by pydantic-ai DynamicWorkflow."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "opensandbox>=0.1.15",
    "pydantic-ai-slim[mcp,openai,web,web-fetch]>=2.52.0",
    "pydantic-ai-harness[dynamic-workflow]>=0.52.0",
    "pydantic-ai-skills>=1.4.0",
]

[project.optional-dependencies]
agent = [
    "fire>=0.7",
    "uvicorn>=0.30",
    "watchfiles>=1.2.0",
    "python-dotenv>=1.0",
    "pandas>=2.3.3",
    "python-calamine>=0.8.2",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_tests.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness", "src/agent"]

[project.scripts]
agent = "agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

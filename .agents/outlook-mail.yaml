name: outlook-mail
description: Summarize, explain, reply to, and delete Outlook mail

capabilities:
  - Playbook:
      instructions: |
        Write summaries and explanations from the message body in the user's language. Do not send the body to another summarization service.
        List or search first (list-mail-messages, list-mail-folder-messages, or search-query). Call get-mail-message only for messages that need to be opened.
        To reply, call create-reply-draft and show the draft. Call reply-mail-message or reply-all-mail-message only after the user explicitly agrees.
        Before delete-mail-message, restate the subject, sender, and time. Call it only after the user explicitly agrees. The tool moves the message to Deleted Items.
        If a mail tool reports that sign-in is required, call login and ask the user to finish the device-code flow.

      nodes: []

      mcp_servers:
        - name: outlook
          # Work or school accounts: append "--org-mode". 21Vianet: append "--cloud", "china".
          commands:
            [
              "npx",
              "-y",
              "--registry=https://registry.npmmirror.com",
              "@softeria/ms-365-mcp-server",
              "--preset",
              "mail",
            ]
          env_vars: [MS365_MCP_TOKEN_CACHE_PATH, MS365_MCP_SELECTED_ACCOUNT_PATH]

      # model_providers:
      #   - name: openai
      #     base_url: https://api.openai.com/v1
      #     api_key: sk-z
      model_providers: []

      # models:
      #   - name: openai-chat:ornith:35b
      #     model_provider: openai

      model_settings:
        temperature: 0.3

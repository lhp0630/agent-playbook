name: code-review
description: Review a GitHub/GitLab commit or PR/MR via code review

instructions: |
  Fetch the user-provided commit/MR/PR URL before reviewing:
  - GitHub URLs: use WebFetch only.
  - GitLab URLs or self-hosted GitLab: use gitlab MCP tools only; do not use WebFetch for GitLab.
  Load and apply the code-review-skill. Produce a concrete review of the fetched diff/PR.

  Before any GitLab MCP call, resolve required params:
  - Parse from the user-provided GitLab URL.
  - Else use an explicit project/path from the user message.
  - If still missing: ask the user to provide the project path or numeric project_id; do not call the tool.

mcp_servers:
  - name: gitlab
    command: npx
    args:
      [
        "-y",
        "--registry=https://registry.npmmirror.com",
        "@zereight/mcp-gitlab",
      ]
    env:
      GITLAB_API_URL: "${GITLAB_API_URL}"
      GITLAB_PERSONAL_ACCESS_TOKEN: "${GITLAB_PERSONAL_ACCESS_TOKEN}"

model_settings:
  temperature: 0.3

capabilities:
  - WebFetch: { local: true }
  - SkillsCapability:
      directories: [.agents/skills]
      include: [code-review-skill]
